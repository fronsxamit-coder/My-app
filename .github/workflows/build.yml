name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unpack project
        run: |
          ls -la
          F=$(ls nexchat.tar* nexchat*.zip 2>/dev/null | head -1)
          test -n "$F" || (echo "Upload the nexchat archive" && exit 1)
          test -f google-services.json || (echo "Upload google-services.json" && exit 1)
          case "$F" in
            *.zip) unzip -q "$F" ;;
            *) tar xf "$F" ;;
          esac
          test -d nexchat || (echo "nexchat folder missing after unpack" && exit 1)
          cp google-services.json nexchat/google-services.json

      - name: Create Android shell
        working-directory: nexchat
        run: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create . --org com.yourname --project-name nexchat --platforms android
          rm -rf lib pubspec.yaml && cp -r /tmp/keep/lib /tmp/keep/pubspec.yaml .
          cp google-services.json android/app/google-services.json
          python3 tools/patch_android.py
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: nexchat
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-apk
          path: nexchat/build/app/outputs/flutter-apk/*.apk
