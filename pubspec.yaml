name: nexchat
description: Lightweight Discord-style messenger with Google login and cloud-saved data.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.1
  record: ^5.1.2
  audioplayers: ^6.1.0
  flutter_webrtc: ^0.11.7
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
